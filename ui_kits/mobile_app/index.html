<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dev Thriller — Mobile App</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../web_app/styles.css"/>
<style>
  html, body { margin:0; padding:0; background: linear-gradient(180deg, #FAF4E6 0%, #F0E7CC 100%); min-height: 100vh; }
  body { padding: 40px 24px 64px; }
  .page { max-width: 1280px; margin: 0 auto; }
  .page > header { margin-bottom: 28px; }
  .page > header .title { font: 500 11px/1 var(--font-mono); letter-spacing:.14em; text-transform:uppercase; color: var(--fg3); margin-bottom: 6px; }
  .page > header h1 { font: 400 44px/1.05 var(--font-display); letter-spacing:-.01em; margin:0 0 4px; }
  .page > header .sub { color: var(--fg2); max-width: 62ch; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 40px 16px;
    margin-top: 36px;
    align-items: start;
  }
  .frame-wrap { display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; overflow: hidden; }
  .frame-wrap .caption {
    font: 500 10px/1 var(--font-mono);
    letter-spacing:.14em; text-transform: uppercase;
    color: var(--fg3);
    text-align: center;
  }
  .frame-wrap .caption strong { color: var(--fg1); font-weight: 700; display: block; margin-bottom: 3px; font-family: var(--font-sans); font-size: 13px; letter-spacing: 0; text-transform: none; }
  /* Scale frames to fit column. Each frame is 402×874 native. */
  .scaler { transform: scale(.56); transform-origin: top center; width: 402px; height: 874px; }
  .scaler-host { width: 225px; height: 490px; overflow: visible; }
</style>
</head>
<body>

<div class="page">
  <header>
    <div class="title">CASE · 0002 · MOBILE SCREENS</div>
    <h1>Mobile app — <span style="font-style:italic">ui kit</span></h1>
    <p class="sub">Five core screens showing the Dev Thriller mobile experience: sign-in, chat list, thread, media grid, and an active upload. Interactive — tap to navigate. Chat list &rarr; Chat thread. Built on the iOS 26 Liquid Glass frame.</p>
  </header>

  <div class="grid" id="grid"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="../web_app/Shell.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>

<script type="text/babel" data-presets="react">
(function(){
const { useState } = React;
const { IOSDevice } = window;
const { MobileLogin, MobileChatList, MobileChatThread, MobileMedia, MobileUpload } = window.UIKit;

function ChatNav() {
  const [open, setOpen] = useState(null);
  if (open) return <MobileChatThread chat={open} onBack={() => setOpen(null)} />;
  return <MobileChatList onOpenChat={setOpen} />;
}

const FRAMES = [
  { title: 'Sign in', sub: 'CASE · 0001 · LOGIN', el: <MobileLogin /> },
  { title: 'Chat list', sub: 'CHATS & DMS', el: <ChatNav /> },
  { title: 'Chat thread', sub: '#Q3-CAMPAIGN', el: <MobileChatThread chat={{n:'q3-campaign'}} /> },
  { title: 'Media library', sub: 'ACROSS ALL CHATS', el: <MobileMedia /> },
  { title: 'Upload in progress', sub: 'RESUMABLE · SHA256', el: <MobileUpload /> },
];

function App() {
  return (
    <>
      {FRAMES.map((f, i) => (
        <div key={i} className="frame-wrap">
          <div className="caption"><strong>{f.title}</strong>{f.sub}</div>
          <div className="scaler-host"><div className="scaler"><IOSDevice>{f.el}</IOSDevice></div></div>
        </div>
      ))}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('grid')).render(<App />);
})();
</script>

</body>
</html>
