# Production docker-compose for a VPS.
# Usage:
#   1. Copy apps/backend/.env to .env.prod at repo root and fill:
#        - MONGO_URI (Atlas SRV)
#        - JWT_ACCESS_SECRET / JWT_REFRESH_SECRET (openssl rand -hex 64)
#        - R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
#        - SMTP_HOST / SMTP_USER / SMTP_PASS
#        - FRONTEND_ORIGIN (your public URL, e.g. https://app.devthriller.example.com)
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# DragonflyDB runs as a sidecar; MongoDB is assumed to be Atlas (don't run it here).
# If you want self-hosted Mongo, add a `mongo:` service mirroring the dev compose.

services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    ulimits:
      memlock: -1
    volumes:
      - dragonfly-data:/data
    command:
      - "--logtostderr"
      - "--cache_mode=true"
      - "--maxmemory=1gb"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6379"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      REDIS_URL: redis://dragonfly:6379
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB:-devthriller}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_UPSTREAM: http://backend:3001
    ports:
      - "80:80"
    # Put a real reverse proxy (Caddy, Traefik, nginx + certbot) in front of this
    # for TLS in production; or set up Cloudflare Tunnel.

volumes:
  dragonfly-data:
