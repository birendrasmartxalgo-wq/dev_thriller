<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState } = React;
const { IOSDevice } = window;
const { MobileLogin, MobileChatList, MobileChatThread, MobileMedia, MobileUpload } = window.UIKit;
const { DesignCanvas, DCSection, DCArtboard } = window;

// Stateful mobile nav: tab bar + chat list -> thread
function MobileApp() {
  const [tab, setTab] = useState('chats');
  const [openChat, setOpenChat] = useState(null);

  if (tab === 'chats' && openChat) {
    return <MobileChatThread chat={openChat} onBack={() => setOpenChat(null)}/>;
  }
  const body = {
    chats: <MobileChatList onOpenChat={(c) => setOpenChat(c)}/>,
    media: <MobileMedia/>,
    upload: <MobileUpload/>,
  }[tab] || <MobileChatList onOpenChat={setOpenChat}/>;

  // patch tab bar control by wrapping and injecting onChange via React.Children
  const I = window.UIKit.I;
  const tabBar = (
    <div style={{display:'flex', borderTop:'1px solid var(--border-soft)', background:'var(--paper-0)', padding:'8px 0 10px', position:'absolute', left:0, right:0, bottom:34}}>
      {[
        { k: 'chats', l: 'Chats', i: I.hash },
        { k: 'media', l: 'Media', i: I.image },
        { k: 'files', l: 'Files', i: I.folder },
        { k: 'upload', l: 'Upload', i: I.plus },
      ].map(t => (
        <div key={t.k} onClick={() => { setTab(t.k); setOpenChat(null); }} style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3, color: tab===t.k ? 'var(--ember-500)' : 'var(--fg3)', cursor:'pointer'}}>
          <div style={{width:22, height:22}}>{t.i}</div>
          <span style={{font:'500 10px/1 var(--font-sans)'}}>{t.l}</span>
        </div>
      ))}
    </div>
  );

  // If screen already has its own tab bar, let ours sit on top; to avoid double tab bar
  // we just return the body as-is (screens already include MobileTabBar).
  return body;
}

// -------------- Additional mobile screens --------------

      </div>
      <div style={{flex:1, overflow:'auto', padding:'18px 16px'}}>

      </div>
    </div>
  );
}

            ))}

          <div style={{display:'flex', alignItems:'center', gap:8, marginTop:10}}>
            <button style={{width:44, height:44, borderRadius:999, background:'#fff', color:'#0E1130', border:0, display:'flex', alignItems:'center', justifyContent:'center'}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <span style={{font:'500 12px/1 var(--font-mono)'}}>0:34 / 2:14</span>
            <div style={{flex:1}}/>
            <div style={{width:36, height:36, borderRadius:999, background:'rgba(255,255,255,.12)', display:'flex', alignItems:'center', justifyContent:'center', color:'#fff'}}>{I.volume}</div>
          </div>
        </div>

        <div style={{background:'#FFFDF8', color:'var(--fg1)', borderTopLeftRadius:22, borderTopRightRadius:22, padding:'16px', marginTop:6, minHeight:230}}>

            <strong style={{fontSize:15}}>Comments</strong>
            <span style={{font:'500 10px/1 var(--font-mono)', color:'var(--fg3)'}}>3</span>

        </div>
      </div>
      <div style={{flex:1, overflow:'auto', padding:'8px 0 80px'}}>

          {w:'RS',c:'var(--ember-500)',a:'Rahul Shah',v:'mentioned you in',t:'#q3-campaign',b:'can you review the director cut?',time:'2m',unread:true},
          {w:'MK',c:'var(--lav-500)',a:'Mia Kern',v:'replied to your thread in',t:'#reel-cut',b:'Locked version pushed.',time:'14m',unread:true},

// --------- Mount design canvas ---------

      <DCSection id="auth" title="Onboarding" subtitle="First launch, sign in, empty workspace">
        <DCArtboard id="m-login" label="Sign in · CASE · 0001" width={402} height={874}>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
