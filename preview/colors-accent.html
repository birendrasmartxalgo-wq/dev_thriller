<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--bg);display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:stretch}
.sw{flex:1;height:88px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;border:1px solid var(--border-soft)}
.sw .hex{font:var(--fw-med) 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.sw .nm{font:var(--fw-semi) 13px/1.2 var(--font-sans);margin-top:4px}
.lab{font:var(--fw-med) 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-bottom:-4px}
</style></head><body>
<div class="lab">Tape · highlight</div>
<div class="row">
  <div class="sw" style="background:var(--tape-50);color:var(--tape-900)"><div class="nm">50</div><div class="hex">#FFF8E1</div></div>
  <div class="sw" style="background:var(--tape-200);color:var(--tape-900)"><div class="nm">200</div><div class="hex">#FFE590</div></div>
  <div class="sw" style="background:var(--tape-500);color:var(--tape-900)"><div class="nm">500</div><div class="hex">#FFCB3D</div></div>
  <div class="sw" style="background:var(--tape-700);color:#fff"><div class="nm">700</div><div class="hex">#D49900</div></div>
  <div class="sw" style="background:var(--tape-900);color:#fff"><div class="nm">900</div><div class="hex">#6E4E00</div></div>
</div>
<div class="lab">Mint · success</div>
<div class="row">
  <div class="sw" style="background:var(--mint-50);color:var(--mint-900)"><div class="nm">50</div><div class="hex">#E7F9F1</div></div>
  <div class="sw" style="background:var(--mint-200);color:var(--mint-900)"><div class="nm">200</div><div class="hex">#9CE5C4</div></div>
  <div class="sw" style="background:var(--mint-500);color:#fff"><div class="nm">500</div><div class="hex">#2EBD82</div></div>
  <div class="sw" style="background:var(--mint-700);color:#fff"><div class="nm">700</div><div class="hex">#17885A</div></div>
  <div class="sw" style="background:var(--mint-900);color:#fff"><div class="nm">900</div><div class="hex">#0A4630</div></div>
</div>
<div class="lab">Lavender · accent</div>
<div class="row">
  <div class="sw" style="background:var(--lav-50);color:var(--lav-900)"><div class="nm">50</div><div class="hex">#F1ECFF</div></div>
  <div class="sw" style="background:var(--lav-200);color:var(--lav-900)"><div class="nm">200</div><div class="hex">#C9BAFF</div></div>
  <div class="sw" style="background:var(--lav-500);color:#fff"><div class="nm">500</div><div class="hex">#8B6BF0</div></div>
  <div class="sw" style="background:var(--lav-700);color:#fff"><div class="nm">700</div><div class="hex">#5E3DC7</div></div>
  <div class="sw" style="background:var(--lav-900);color:#fff"><div class="nm">900</div><div class="hex">#2B1766</div></div>
</div>
</body></html>
