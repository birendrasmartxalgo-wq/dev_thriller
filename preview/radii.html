<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:var(--bg);display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.tile{width:100px;height:100px;background:var(--paper-0);border:1px solid var(--border-soft);box-shadow:var(--sh-1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.n{font:var(--fw-semi) 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.v{font:var(--fw-reg) 11px/1 var(--font-mono);color:var(--fg3)}
</style></head><body>
<div class="tile" style="border-radius:3px"><div class="n">r-xs</div><div class="v">3px</div></div>
<div class="tile" style="border-radius:6px"><div class="n">r-sm</div><div class="v">6px</div></div>
<div class="tile" style="border-radius:10px"><div class="n">r-md</div><div class="v">10px</div></div>
<div class="tile" style="border-radius:14px"><div class="n">r-lg</div><div class="v">14px</div></div>
<div class="tile" style="border-radius:20px"><div class="n">r-xl</div><div class="v">20px</div></div>
<div class="tile" style="border-radius:999px"><div class="n">r-pill</div><div class="v">999</div></div>
</body></html>
