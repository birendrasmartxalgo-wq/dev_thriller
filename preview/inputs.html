<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--bg);display:grid;gap:14px;max-width:600px}
.group{display:grid;gap:6px}
label{font:var(--fw-med) 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.inp{font:var(--fw-reg) 15px/1.2 var(--font-sans);padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--paper-0);color:var(--fg1);outline:none;transition:all 140ms var(--ease-out)}
.inp:focus{border-color:var(--ember-500);box-shadow:var(--sh-focus)}
.inp.err{border-color:var(--blood-500)}
.hint{font:var(--fw-reg) 12px/1.3 var(--font-sans);color:var(--fg3)}
.err-msg{font:var(--fw-reg) 12px/1.3 var(--font-sans);color:var(--blood-700)}
.search{position:relative}
.search .inp{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--fg3)}
.row{display:flex;gap:12px;align-items:center}
.chk{display:flex;align-items:center;gap:8px;font:var(--fw-reg) 14px/1 var(--font-sans);color:var(--fg1)}
.chk input{accent-color:var(--ember-500);width:16px;height:16px}
</style></head><body>
<div class="group">
  <label>Email</label>
  <input class="inp" value="rahul@devthriller.io">
</div>
<div class="group">
  <label>Workspace name</label>
  <input class="inp" placeholder="e.g. Acme marketing">
  <div class="hint">Lowercase letters, numbers, and hyphens.</div>
</div>
<div class="group">
  <label>Password</label>
  <input class="inp err" type="password" value="••••">
  <div class="err-msg">Must be at least 12 characters.</div>
</div>
<div class="group search">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input class="inp" placeholder="Search files, chats, people…">
</div>
<div class="row">
  <label class="chk"><input type="checkbox" checked> Remember me</label>
  <label class="chk"><input type="checkbox"> Enable MFA</label>
</div>
</body></html>
