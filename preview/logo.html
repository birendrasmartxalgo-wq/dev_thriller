<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:var(--bg);display:grid;gap:16px;grid-template-columns:1fr 1fr;align-items:center}
.tile{padding:20px;border-radius:14px;border:1px solid var(--border-soft);display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;min-height:110px}
.tile.dark{background:var(--ink-900)}
.tile.light{background:var(--paper-0)}
.cap{font:var(--fw-med) 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
</style></head><body>
<div class="tile light"><img src="../assets/logo-wordmark.svg" height="44"><div class="cap">On paper · default</div></div>
<div class="tile dark"><img src="../assets/logo-wordmark-dark.svg" height="44"><div class="cap" style="color:var(--ink-200)">On ink</div></div>
<div class="tile light"><img src="../assets/logo-monogram.svg" width="72"><div class="cap">Monogram · square</div></div>
<div class="tile" style="background:var(--ember-500)"><img src="../assets/logo-monogram.svg" width="72" style="filter:brightness(0) invert(1)"><div class="cap" style="color:#fff">Knocked out</div></div>
</body></html>
