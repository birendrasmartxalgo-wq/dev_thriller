<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--bg);display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:stretch}
.sw{flex:1;height:88px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;border:1px solid var(--border-soft)}
.sw .hex{font:var(--fw-med) 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.sw .nm{font:var(--fw-semi) 13px/1.2 var(--font-sans);margin-top:4px}
.lab{font:var(--fw-med) 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-bottom:-4px}
</style></head><body>
<div class="lab">Ember · primary</div>
<div class="row">
  <div class="sw" style="background:var(--ember-50);color:var(--ember-900)"><div class="nm">50</div><div class="hex">#FFF1EC</div></div>
  <div class="sw" style="background:var(--ember-200);color:var(--ember-900)"><div class="nm">200</div><div class="hex">#FFC9B6</div></div>
  <div class="sw" style="background:var(--ember-500);color:#fff"><div class="nm">500</div><div class="hex">#FF512E</div></div>
  <div class="sw" style="background:var(--ember-700);color:#fff"><div class="nm">700</div><div class="hex">#C8361A</div></div>
  <div class="sw" style="background:var(--ember-900);color:#fff"><div class="nm">900</div><div class="hex">#6B1708</div></div>
</div>
<div class="lab">Ink · deep navy</div>
<div class="row">
  <div class="sw" style="background:var(--ink-50);color:var(--ink-900)"><div class="nm">50</div><div class="hex">#EDEFF6</div></div>
  <div class="sw" style="background:var(--ink-200);color:var(--ink-900)"><div class="nm">200</div><div class="hex">#A9B0CC</div></div>
  <div class="sw" style="background:var(--ink-500);color:#fff"><div class="nm">500</div><div class="hex">#3A4272</div></div>
  <div class="sw" style="background:var(--ink-700);color:#fff"><div class="nm">700</div><div class="hex">#1E2247</div></div>
  <div class="sw" style="background:var(--ink-900);color:#fff"><div class="nm">900</div><div class="hex">#0E1130</div></div>
</div>
</body></html>
