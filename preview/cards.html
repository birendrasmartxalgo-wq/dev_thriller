<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--bg);display:grid;gap:16px;grid-template-columns:1fr 1fr}
.card{background:var(--bg-raised);border:1px solid var(--border-soft);border-radius:14px;box-shadow:var(--sh-1),var(--sh-inset);padding:16px;display:grid;gap:8px}
.meta{font:var(--fw-med) 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);display:flex;gap:8px;align-items:center}
.meta .sep{color:var(--paper-300)}
.title{font:var(--fw-bold) 16px/1.2 var(--font-sans);color:var(--fg1)}
.sub{font:var(--fw-reg) 13px/1.45 var(--font-sans);color:var(--fg2)}
.foot{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--border-soft);font:var(--fw-med) 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.av{width:22px;height:22px;border-radius:999px;background:var(--lav-500);color:#fff;font:var(--fw-semi) 10px/1 var(--font-sans);display:flex;align-items:center;justify-content:center}
.stack{display:flex}
.stack .av{margin-right:-6px;border:2px solid var(--bg-raised)}
.accent{height:3px;background:var(--ember-500);border-radius:3px;margin:-16px -16px 8px -16px;border-top-left-radius:14px;border-top-right-radius:14px}
</style></head><body>
<div class="card">
  <div class="meta"><span>CASE · 0142</span><span class="sep">·</span><span>PROJECT</span></div>
  <div class="title">Q3 Campaign Dossier</div>
  <div class="sub">12 files · 4 chats · updated 2 min ago</div>
  <div class="foot">
    <div class="stack"><div class="av">RS</div><div class="av" style="background:var(--ember-500)">MK</div><div class="av" style="background:var(--mint-500)">JL</div></div>
    <span style="margin-left:auto">3 members</span>
  </div>
</div>
<div class="card">
  <div class="accent"></div>
  <div class="meta"><span>FILE · 8812A</span><span class="sep">·</span><span>MP4</span></div>
  <div class="title">reel-final-v4.mp4</div>
  <div class="sub">842 MB · uploaded by Rahul · sha256 verified</div>
  <div class="foot"><span>14:02</span><span class="sep" style="color:var(--paper-300)">·</span><span>RESOLVED</span></div>
</div>
</body></html>
