<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--bg);display:grid;gap:10px}

.bar{height:14px;background:var(--ember-500);border-radius:3px}
.px{font:var(--fw-reg) 11px/1 var(--font-mono);color:var(--fg3);margin-left:auto}
</style></head><body>

<div class="row"><div class="name">s-11</div><div class="bar" style="width:80px"></div><div class="px">80px</div></div>
<div class="row"><div class="name">s-12</div><div class="bar" style="width:120px"></div><div class="px">120px</div></div>
