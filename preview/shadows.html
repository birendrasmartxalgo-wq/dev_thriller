<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:40px 28px;background:var(--bg);display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.tile{width:110px;height:110px;background:var(--paper-0);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--border-soft)}
.tile.s1{box-shadow:var(--sh-1)}
.tile.s2{box-shadow:var(--sh-2)}
.tile.s3{box-shadow:var(--sh-3)}
.tile.s4{box-shadow:var(--sh-4)}
.n{font:var(--fw-semi) 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.v{font:var(--fw-reg) 11px/1.3 var(--font-mono);color:var(--fg3);text-align:center;max-width:90%}
</style></head><body>
<div class="tile"><div class="n">sh-0</div><div class="v">none</div></div>
<div class="tile s1"><div class="n">sh-1</div><div class="v">resting card</div></div>
<div class="tile s2"><div class="n">sh-2</div><div class="v">hover / popover</div></div>
<div class="tile s3"><div class="n">sh-3</div><div class="v">menu / dropdown</div></div>
<div class="tile s4"><div class="n">sh-4</div><div class="v">modal / sheet</div></div>
</body></html>
