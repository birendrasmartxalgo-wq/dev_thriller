<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--bg);display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:stretch}
.sw{flex:1;height:88px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;border:1px solid var(--border-soft)}
.sw .hex{font:var(--fw-med) 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.sw .nm{font:var(--fw-semi) 13px/1.2 var(--font-sans);margin-top:4px}
.lab{font:var(--fw-med) 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-bottom:-4px}
</style></head><body>
<div class="lab">Paper · surfaces (warm, never pure white)</div>
<div class="row">
  <div class="sw" style="background:var(--paper-0);color:var(--char-900)"><div class="nm">paper-0</div><div class="hex">#FFFDF8</div></div>
  <div class="sw" style="background:var(--paper-50);color:var(--char-900)"><div class="nm">paper-50</div><div class="hex">#FAF6EC</div></div>
  <div class="sw" style="background:var(--paper-100);color:var(--char-900)"><div class="nm">paper-100</div><div class="hex">#F1EBDB</div></div>
  <div class="sw" style="background:var(--paper-200);color:var(--char-900)"><div class="nm">paper-200</div><div class="hex">#E3D9C0</div></div>
  <div class="sw" style="background:var(--paper-300);color:var(--char-900)"><div class="nm">paper-300</div><div class="hex">#C9BD9E</div></div>
  <div class="sw" style="background:var(--paper-400);color:#fff"><div class="nm">paper-400</div><div class="hex">#8F8467</div></div>
</div>
<div class="lab">Charcoal · text (warm, never pure black)</div>
<div class="row">
  <div class="sw" style="background:var(--char-500);color:#fff"><div class="nm">char-500</div><div class="hex">#595243</div></div>
  <div class="sw" style="background:var(--char-700);color:#fff"><div class="nm">char-700</div><div class="hex">#35301F</div></div>
  <div class="sw" style="background:var(--char-900);color:#fff"><div class="nm">char-900</div><div class="hex">#1B1808</div></div>
  <div class="sw" style="background:var(--blood-500);color:#fff"><div class="nm">blood-500</div><div class="hex">#D61F3E</div></div>
  <div class="sw" style="background:var(--blood-700);color:#fff"><div class="nm">blood-700</div><div class="hex">#99142B</div></div>
</div>
</body></html>
