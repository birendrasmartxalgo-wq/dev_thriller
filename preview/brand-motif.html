<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:var(--bg);display:grid;gap:20px}
.hero{padding:28px 24px;border-radius:14px;background:var(--paper-0);border:1px solid var(--border-soft);box-shadow:var(--sh-1),var(--sh-inset);display:grid;gap:10px}
.kicker{font:var(--fw-med) 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.motif{font:var(--fw-reg) 44px/1.05 var(--font-display);color:var(--fg1);letter-spacing:-.01em}
.sub{font:var(--fw-reg) 14px/1.5 var(--font-sans);color:var(--fg2)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper-100);border:1px solid var(--border-soft);font:var(--fw-med) 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.dot{width:6px;height:6px;border-radius:999px;background:var(--ember-500)}
</style></head><body>
<div class="hero">
  <div class="kicker">CASE · 0001 — BRAND MANIFESTO</div>
  <div class="motif">A <span class="tape-highlight">quiet thriller</span> for teams that ship.</div>
  <div class="sub">Dev Thriller pairs case-file drama with dev-tool precision. Warm paper surfaces, a single hot accent, monospace metadata, and the occasional wink.</div>
  <div class="row">
    <span class="chip"><span class="dot"></span>Paper surface</span>
    <span class="chip"><span class="dot" style="background:var(--tape-500)"></span>Tape highlight</span>
    <span class="chip"><span class="dot" style="background:var(--ink-900)"></span>Ink inverse</span>
    <span class="chip"><span class="dot" style="background:var(--mint-500)"></span>Mint success</span>
  </div>
</div>
</body></html>
