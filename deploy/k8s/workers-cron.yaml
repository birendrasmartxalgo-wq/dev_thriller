# CronJobs for the three maintenance workers.
# Reuses the backend image — the workers live under apps/workers but depend on @dt/backend.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention
  namespace: dev-thriller
spec:
  schedule: "0 3 * * *" # 03:00 UTC daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: retention
              image: ghcr.io/YOUR_ORG/dt-backend:latest
              command: ["bun", "run", "/app/apps/workers/src/retention.ts", "--apply"]
              envFrom:
                - secretRef: { name: dt-secrets }
              env:
                - name: REDIS_URL
                  value: "redis://dragonfly.dev-thriller.svc.cluster.local:6379"
---
apiVersion: batch/v1
kind: CronJob
metadata:
